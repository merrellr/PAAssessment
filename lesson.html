<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — Product Advisory Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1A4584; --navy-deep: #12305e; --gray: #9AA3AD; --cyan: #35C2E8;
    --bg: #F5F8FB; --surface: #FFFFFF; --ink: #16213E; --ink-soft: #4B5768; --line: #E3E9F0;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); font-family:'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand-accent-bar{ height: 3px; background: linear-gradient(90deg, var(--navy) 0%, var(--cyan) 100%); border-radius: 2px; margin-bottom: 24px; }
  .back-link{ font-size: 13px; color: var(--gray); text-decoration:none; display:inline-block; margin-bottom: 16px; }
  .back-link:hover{ color: var(--navy); }
  .card{ background: var(--surface); border-radius: 16px; border: 1px solid var(--line); padding: 32px; box-shadow: 0 1px 2px rgba(22,33,62,0.04), 0 12px 32px rgba(22,33,62,0.06); }
  .eyebrow{ font-size: 12px; font-weight:600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cyan); margin-bottom: 8px; display:block; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size: 20px; margin: 0 0 18px; color: var(--navy-deep); }
  p{ line-height:1.6; color: var(--ink-soft); }
  #lessonBody p{ margin: 0 0 14px; }
  #lessonBody ul{ margin: 0 0 14px; padding-left: 20px; }
  #lessonBody li{ line-height:1.6; color: var(--ink-soft); margin-bottom: 8px; }
  #lessonBody strong{ color: var(--ink); }
  .lesson-image{ width:100%; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 16px; display:block; }
  .lesson-image-caption{ font-size: 12.5px; color: var(--gray); text-align:center; margin: -8px 0 18px; }

  .check-box{ background:#F7F9FC; border: 1.5px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-top: 24px; }
  .check-box .check-eyebrow{ font-size: 11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color: var(--cyan); display:block; margin-bottom: 8px; }
  .check-box .check-q{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 14.5px; color: var(--navy-deep); margin-bottom: 12px; }
  .check-option{ display:block; width:100%; text-align:left; padding: 10px 13px; margin-bottom: 8px; border: 1.5px solid var(--line); border-radius: 8px; background:#fff; font-family:'IBM Plex Sans', sans-serif; font-size: 13.5px; color: var(--ink); cursor:pointer; }
  .check-option:hover{ border-color: var(--cyan); }
  .check-option.correct{ border-color: #2E8B57; background:#EEF9F1; }
  .check-option.incorrect{ border-color: #C0622A; background:#FCEFE9; }
  .check-feedback{ font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink-soft); display:none; }
  .check-feedback.show{ display:block; }
  .check-feedback strong{ color: var(--ink); }

  .chart-box{ margin-top: 20px; }
  .chart-slider-row{ display:flex; align-items:center; gap:12px; margin-bottom: 14px; }
  .chart-slider-row input[type=range]{ flex:1; accent-color: var(--cyan); }
  .chart-slider-row .chart-x-label{ font-size: 13px; color: var(--ink-soft); min-width: 68px; text-align:right; }
  .chart-stats{ display:flex; gap:14px; margin-bottom: 14px; flex-wrap: wrap; }
  .chart-stat{ flex:1; min-width: 120px; background:#F7F9FC; border-radius: 10px; padding: 10px 12px; }
  .chart-stat .clabel{ font-size: 11.5px; color: var(--gray); margin-bottom: 2px; }
  .chart-stat .cval{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 18px; }
  .chart-caption{ font-size: 11.5px; color: var(--gray); text-align:center; margin-top: 6px; }

  .stepper-box{ margin-top: 8px; }
  .stepper-dots{ display:flex; gap:6px; margin-bottom: 14px; }
  .stepper-dot{ flex:1; height:4px; border-radius:2px; background: var(--line); cursor:pointer; }
  .stepper-dot.active{ background: var(--navy); }
  .stepper-dot.seen{ background: var(--cyan); }
  .stepper-card{ background:#F7F9FC; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .stepper-card .snum{ font-size: 11px; font-weight:600; color: var(--cyan); text-transform:uppercase; letter-spacing:0.04em; margin-bottom: 6px; }
  .stepper-card h4{ font-family:'Space Grotesk', sans-serif; font-size: 14.5px; margin: 0 0 8px; color: var(--navy-deep); }
  .stepper-card p{ font-size: 13.5px; margin: 0; }
  .stepper-nav{ display:flex; justify-content:space-between; }
  .stepper-nav button{ font-family:'IBM Plex Sans', sans-serif; font-size: 13px; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background:#fff; cursor:pointer; color: var(--ink); }
  .stepper-nav button:disabled{ opacity:0.35; cursor:not-allowed; }

  .reflection-box{ background:#F7F9FC; border-radius: 12px; padding: 16px 18px; margin-top: 20px; }
  .reflection-box .rlabel{ font-size: 11px; font-weight:600; color: var(--cyan); text-transform:uppercase; letter-spacing:0.04em; margin-bottom: 8px; display:block; }
  .reflection-box textarea{ width:100%; min-height: 80px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; font-family:'IBM Plex Sans', sans-serif; font-size: 13.5px; resize:vertical; }
  .reflection-box textarea:focus{ outline:none; border-color: var(--cyan); }
  .reflection-save-row{ display:flex; justify-content:space-between; align-items:center; margin-top: 10px; }
  .reflection-save-row button{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 13px; padding: 8px 16px; border-radius: 7px; border:none; background: var(--navy); color:#fff; cursor:pointer; }
  .linkedin-box{ background:#F7F9FC; border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 22px; }
  .linkedin-box p{ font-size: 13.5px; margin: 0 0 12px; color: var(--ink-soft); }
  .linkedin-btn{ display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:#fff; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 13.5px; padding: 9px 16px; border-radius: 8px; text-decoration:none; }
  .linkedin-btn:hover{ background:var(--navy-deep); }
  .reflection-saved-note{ font-size: 12px; color: var(--gray); }
  .lesson-nav{ display:flex; gap:8px; margin: 24px 0; flex-wrap:wrap; }
  .lesson-pill{ padding: 7px 12px; border-radius: 7px; font-size: 12.5px; font-weight:500; border: 1px solid var(--line); background:#fff; color: var(--ink-soft); text-decoration:none; }
  .lesson-pill.done{ background:#EEF3FA; border-color: var(--cyan); color: var(--navy); }
  .lesson-pill.current{ border-color: var(--navy); color: var(--navy); font-weight:600; }
  .nav-row{ display:flex; justify-content:space-between; margin-top: 26px; }
  button.btn{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 14px; border-radius: 8px; padding: 11px 20px; border: none; cursor:pointer; }
  .btn-primary{ background: var(--navy); color:#fff; }
  .btn-primary:hover{ background: var(--navy-deep); }
  .btn-ghost{ background:none; color: var(--gray); border: 1px solid var(--line); }
  .status-msg{ font-size: 13px; color: var(--gray); margin-top: 10px; }
</style>
</head>

      <div style="font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:10px; letter-spacing:0.06em; color:var(--gray); line-height:1;">PRODUCT ADVISORY</div>

<!-- ================================================================
     COURSE CONTENT FILES
     One <script> tag per course that has real content. To add a new
     course, create a new file in /content/ (copy the pattern of an
     existing one) and add one line here. Order doesn't matter — these
     just need to run before the module script below, which they
     always will since classic <script> tags run immediately while
     the module script waits until the page finishes loading.

<script type="module">
/* ================================================================
   Uses the same Firebase config and course catalog as the
   dashboard. If you edit the catalog in lms-dashboard.html, copy
   the same CATALOG block here too so both pages stay in sync.
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAcECtS5c6WeOhKlwRK-LYFE47npbuq_eU",
  authDomain: "product-advisory-lms.firebaseapp.com",
  projectId: "product-advisory-lms",
  storageBucket: "product-advisory-lms.firebasestorage.app",
  messagingSenderId: "1081134406437",
  appId: "1:1081134406437:web:72e28604d093219e7698cc"
};

const DOMAINS = {
  discovery: { label: "Customer & Market Discovery" },
  strategy: { label: "Product Strategy & Roadmapping" },
  prioritization: { label: "Prioritization & Trade-offs" },
  execution: { label: "Execution & Delivery" },
  stakeholder: { label: "Stakeholder Communication & Influence" },
  aiIndividual: { label: "AI Fluency — Individual" },
  aiOrg: { label: "AI Fluency — Organizational" }
};
const TIERS = [
  { slug: "novice", label: "No Experience" },
  { slug: "moderate", label: "Moderate Experience" },
  { slug: "experienced", label: "Lots of Experience" },
  { slug: "advanced", label: "Advanced Experience" }
];
/* ================================================================
   EASY-EDIT ZONE: REAL LESSON CONTENT
   Content now lives in separate files under /content/, one file per
   course (e.g. content/aiOrg-moderate.js). This variable just reads
   whatever those files have already loaded onto the page — see the
   <script src="content/..."> tags in the <head> of this file. Any
   course without a dedicated content file still falls back to the
   generic 3-lesson placeholder automatically.
   ================================================================ */
const CONTENT_OVERRIDES = window.CONTENT_OVERRIDES || {};

function buildCatalog(){
  const catalog = {};
  Object.keys(DOMAINS).forEach(domainKey => {
    TIERS.forEach(tier => {
      const courseId = domainKey + "-" + tier.slug;
      catalog[courseId] = {
        title: DOMAINS[domainKey].label + " — " + tier.label,
        lessons: [
          { id: 1, title: "Lesson 1: Placeholder introduction", body: "<p>This is placeholder lesson content. Replace this whenever real material is ready — nothing else on this page needs to change.</p>" },
          { id: 2, title: "Lesson 2: Placeholder core concept", body: "<p>This is placeholder lesson content. Replace this whenever real material is ready — nothing else on this page needs to change.</p>" },
          { id: 3, title: "Lesson 3: Placeholder practice + wrap-up", body: "<p>This is placeholder lesson content. Replace this whenever real material is ready — nothing else on this page needs to change.</p>" }
        ]
      };
      if (CONTENT_OVERRIDES[courseId]) {
        catalog[courseId].lessons = CONTENT_OVERRIDES[courseId].lessons;
        catalog[courseId].sourceUrl = CONTENT_OVERRIDES[courseId].sourceUrl || null;
        catalog[courseId].recap = CONTENT_OVERRIDES[courseId].recap || null;
      }
    });
  });
  return catalog;
}
const CATALOG = buildCatalog();

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* Course content is gated behind the assessment. This is the same
   lookup the dashboard uses to decide whether to show the real
   catalog or the locked teaser — keep the URL in sync with
   RESULTS_LOG_URL in lms-dashboard.html and index.html. */
const RESULTS_LOG_URL = "https://script.google.com/macros/s/AKfycbynJQYF9rv5maL_CGniS9UGhTDfBVeW3gVhEWUsFdGOqquv4osGx4nQvc8jNkaaY6wrrg/exec";

function fetchAssessmentResult(email){
  return new Promise((resolve) => {
    if (!RESULTS_LOG_URL) { resolve(null); return; }
    const callbackName = 'lookupCallback_' + Date.now();
    window[callbackName] = function(result){
      delete window[callbackName];
      script.remove();
      resolve(result || null);
    };
    const script = document.createElement('script');
    script.src = RESULTS_LOG_URL + '?action=lookup&email=' + encodeURIComponent(email) + '&callback=' + callbackName;
    script.onerror = function(){ resolve(null); };
    document.body.appendChild(script);
  });
}

/* Shown in place of the lesson when a logged-in user has no
   assessment result yet. Mirrors the dashboard's locked state. */
function showAssessmentLock(){
  document.getElementById('courseTitle').textContent = 'Locked';
  document.getElementById('lessonTitle').textContent = 'Take the assessment to unlock this course';
  const nav = document.getElementById('lessonNav');
  if (nav) nav.style.display = 'none';
  const navRow = document.querySelector('.nav-row');
  if (navRow) navRow.style.display = 'none';
  ['preCheckContainer','chartContainer','stepperContainer','checkContainer','reflectionContainer','sourceLinkRow']
    .forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  document.getElementById('lessonBody').innerHTML = `
    <div style="background:#F7F9FC; border:1.5px solid var(--line); border-radius:12px; padding:24px; text-align:center; margin-top:8px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--gray)" stroke-width="2" style="margin-bottom:10px;">
        <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
      <p style="margin:0 0 8px; color:var(--ink); font-weight:600;">This course is locked until you take the assessment.</p>
      <p style="margin:0 0 16px; font-size:13.5px;">The assessment places you at the right level in each skill area, so every course starts where you are. It takes about five minutes.</p>
      <a href="index.html" class="btn btn-primary" style="text-decoration:none; display:inline-block;">Take the assessment →</a>
    </div>
  `;
}

const params = new URLSearchParams(window.location.search);
const courseId = params.get('course');
let lessonNum = parseInt(params.get('lesson') || '1', 10);
const course = CATALOG[courseId];

let currentUser = null;
let completedLessons = [];
let reflections = {};
let assessmentResult = null;   // filled by the gating check; reused for "next course"
let allCourses = {};           // full progress.courses map, for the completion screen

if (!course){
  document.getElementById('lessonTitle').textContent = 'Course not found';
  document.getElementById('courseTitle').textContent = '';
  document.getElementById('lessonBody').innerHTML = '<p>This link is missing a valid course. Go back to the dashboard and click into a course from there rather than typing this URL directly.</p>';
} else {
  document.getElementById('courseTitle').textContent = course.title;
}

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = 'lms-dashboard.html';
    return;
  }
  currentUser = user;
  if (!course) return; // already showed a friendly message above

  // Gate content behind the assessment: no result means the courses
  // aren't unlocked yet, so show the lock panel instead of the lesson.
  assessmentResult = await fetchAssessmentResult(user.email);
  if (!assessmentResult){
    showAssessmentLock();
    return;
  }

  try {
    await loadProgress();
    // Revisiting a finished course (no ?lesson= in the URL) lands on
    // the completion screen rather than re-opening the last lesson.
    const allDone = course.lessons.every(l => completedLessons.includes(l.id));
    if (allDone && !params.get('lesson')){
      showCourseComplete(allCourses);
      return;
    }
    renderLesson();
    startActiveTimeTracking();
  } catch (err){
    console.error('Lesson load failed:', err);
    document.getElementById('lessonBody').innerHTML = '<p>Something went wrong loading this lesson (' + err.message + '). Check the browser console for details, or try refreshing.</p>';
  }
});

/* Same active-time tracker as the dashboard — only counts time while
   this tab is visible, flushed to Firestore via atomic increment. */
let activeTimeSegmentStart = document.hidden ? null : Date.now();

function flushActiveTime(){
  if (activeTimeSegmentStart === null || !currentUser) return;
  const elapsed = Date.now() - activeTimeSegmentStart;
  activeTimeSegmentStart = document.hidden ? null : Date.now();
  if (elapsed < 1000) return;
  const progressRef = doc(db, 'progress', currentUser.uid);
  setDoc(progressRef, { totalActiveMs: increment(elapsed) }, { merge: true }).catch(() => {});
}

function startActiveTimeTracking(){
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      flushActiveTime();
    } else {
      activeTimeSegmentStart = Date.now();
    }
  });
  window.addEventListener('pagehide', flushActiveTime);
  setInterval(flushActiveTime, 60000);
}

async function loadProgress(){
  const progressRef = doc(db, 'progress', currentUser.uid);
  const snap = await getDoc(progressRef);
  const data = snap.exists() ? snap.data() : { courses: {} };
  allCourses = data.courses || {};
  const courseProgress = allCourses[courseId] || { completed: [] };
  completedLessons = courseProgress.completed || [];
  reflections = courseProgress.reflections || {};

  // If arriving fresh (no ?lesson= in URL) resume at the first incomplete lesson
  if (!params.get('lesson')){
    const nextIncomplete = course.lessons.find(l => !completedLessons.includes(l.id));
    lessonNum = nextIncomplete ? nextIncomplete.id : course.lessons[course.lessons.length - 1].id;
  }
}

function renderLesson(){
  if (!course) return;
  const lesson = course.lessons.find(l => l.id === lessonNum) || course.lessons[0];
  document.getElementById('lessonTitle').textContent = lesson.title;

  // "Predict, then reveal" — an optional question shown BEFORE the body
  // text, framed as a guess. The body right below then reveals what
  // actually happens, so reading becomes checking your prediction
  // rather than just absorbing information passively.
  renderChecksInto('preCheckContainer', lesson.preCheck ? [lesson.preCheck] : null);

  const imageHtml = lesson.image
    ? `<img class="lesson-image" src="${lesson.image.src}" alt="${lesson.image.alt}"><div class="lesson-image-caption">${lesson.image.alt}</div>`
    : '';
  document.getElementById('lessonBody').innerHTML = imageHtml + lesson.body;

  renderChart(lesson.chart);
  renderStepper(lesson.steps);

  // Supports either "checks" (an array, for more than one question)
  // or the older singular "check" — both render the same way.
  const checksArray = lesson.checks || (lesson.check ? [lesson.check] : null);
  renderChecksInto('checkContainer', checksArray);

  renderReflection(lesson.reflection, lesson.id);

  const nav = document.getElementById('lessonNav');
  nav.innerHTML = '';
  course.lessons.forEach(l => {
    const pill = document.createElement('a');
    pill.href = 'lesson.html?course=' + courseId + '&lesson=' + l.id;
    pill.className = 'lesson-pill' + (completedLessons.includes(l.id) ? ' done' : '') + (l.id === lessonNum ? ' current' : '');
    pill.textContent = 'Lesson ' + l.id;
    nav.appendChild(pill);
  });

  document.getElementById('prevBtn').style.visibility = lessonNum === 1 ? 'hidden' : 'visible';
  const isLast = lessonNum === course.lessons[course.lessons.length - 1].id;
  document.getElementById('completeBtn').textContent = isLast ? 'Complete' : 'Next →';

  const sourceRow = document.getElementById('sourceLinkRow');
  if (isLast && course.sourceUrl){
    sourceRow.style.display = 'block';
    document.getElementById('sourceLinkAnchor').href = course.sourceUrl;
  } else {
    sourceRow.style.display = 'none';
  }
}

/* Reusable interactive 2-series line chart. Draws an SVG line chart
   with an x-axis slider — as the user drags it, both lines redraw up
   to that point and the two stat numbers update. Purely illustrative
   (not real measured data), which is called out in the caption.

   Config shape (course content passes this as `chart` on a lesson):
     {
       unit: 'Month' | 'Week' | 'Quarter' | ...,   // x-axis label prefix
       maxX: 12,                                    // number of x steps
       series: [
         { label: 'Series A name', color: '#9AA3AD', at: (x) => number },
         { label: 'Series B name', color: '#1A4584', at: (x) => number }
       ],
       caption: 'optional override for the note under the chart'
     }
   Exactly two series are expected (this is a 2-series component), but
   the drawing logic itself doesn't hardcode which two. */
function renderChart(chart){
  const container = document.getElementById('chartContainer');
  container.innerHTML = '';
  if (!chart || !chart.series || chart.series.length < 2) return;

  const [a, b] = chart.series;
  const box = document.createElement('div');
  box.className = 'chart-box';
  box.innerHTML = `
    <div class="chart-slider-row">
      <input type="range" min="1" max="${chart.maxX}" value="${chart.maxX}" id="chartSlider">
      <span class="chart-x-label" id="chartXLabel">${chart.unit} ${chart.maxX}</span>
    </div>
    <svg id="chartSvg" viewBox="0 0 400 180" style="width:100%; height:auto;"></svg>
    <div class="chart-stats">
      <div class="chart-stat"><div class="clabel">${a.label}</div><div class="cval" id="chartVal0" style="color:${a.color};"></div></div>
      <div class="chart-stat"><div class="clabel">${b.label}</div><div class="cval" id="chartVal1" style="color:${b.color};"></div></div>
    </div>
    <div class="chart-caption">${chart.caption || 'Illustrative model, not measured data'}</div>
  `;
  container.appendChild(box);

  const slider = box.querySelector('#chartSlider');
  const svg = box.querySelector('#chartSvg');
  const valEls = [box.querySelector('#chartVal0'), box.querySelector('#chartVal1')];

  function draw(stepsShown){
    let maxVal = 0;
    for (let x = 1; x <= chart.maxX; x++){
      chart.series.forEach(s => { maxVal = Math.max(maxVal, s.at(x)); });
    }
    const seriesPoints = chart.series.map(s => {
      const pts = [];
      for (let x = 1; x <= stepsShown; x++){
        const px = 20 + (x - 1) * (360 / (chart.maxX - 1));
        pts.push([px, 160 - (s.at(x) / maxVal) * 140]);
      }
      return pts;
    });
    const toPath = (pts) => pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

    const linesHtml = chart.series.map((s, i) =>
      `<path d="${toPath(seriesPoints[i])}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`
    ).join('');
    const dotsHtml = chart.series.map((s, i) => {
      const pts = seriesPoints[i];
      return pts.length ? `<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4" fill="${s.color}"/>` : '';
    }).join('');

    svg.innerHTML = `
      <line x1="20" y1="160" x2="380" y2="160" stroke="#E3E9F0" stroke-width="1"/>
      ${linesHtml}
      ${dotsHtml}
    `;

    chart.series.forEach((s, i) => { valEls[i].textContent = Math.round(s.at(stepsShown)); });
    box.querySelector('#chartXLabel').textContent = chart.unit + ' ' + stepsShown;
  }

  slider.oninput = () => draw(parseInt(slider.value, 10));
  draw(chart.maxX);
}

/* Click-through stepper for sequential processes. Shows one step
   at a time with dot navigation, rather than a static bullet list. */
function renderStepper(steps){
  const container = document.getElementById('stepperContainer');
  container.innerHTML = '';
  if (!steps || !steps.length) return;

  let current = 0;
  const box = document.createElement('div');
  box.className = 'stepper-box';
  box.innerHTML = `
    <div class="stepper-dots" id="stepperDots"></div>
    <div class="stepper-card" id="stepperCard"></div>
    <div class="stepper-nav">
      <button id="stepperPrev" type="button">← Previous step</button>
      <button id="stepperNext" type="button">Next step →</button>
    </div>
  `;
  container.appendChild(box);

  const dotsWrap = box.querySelector('#stepperDots');
  steps.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'stepper-dot';
    dot.onclick = () => { current = i; render(); };
    dotsWrap.appendChild(dot);
  });

  function render(){
    const step = steps[current];
    box.querySelector('#stepperCard').innerHTML = `
      <div class="snum">Step ${current + 1} of ${steps.length}</div>
      <h4>${step.title}</h4>
      <p>${step.detail}</p>
    `;
    Array.from(dotsWrap.children).forEach((dot, i) => {
      dot.classList.toggle('active', i === current);
      dot.classList.toggle('seen', i < current);
    });
    box.querySelector('#stepperPrev').disabled = current === 0;
    box.querySelector('#stepperNext').disabled = current === steps.length - 1;
  }

  box.querySelector('#stepperPrev').onclick = () => { if (current > 0){ current--; render(); } };
  box.querySelector('#stepperNext').onclick = () => { if (current < steps.length - 1){ current++; render(); } };
  render();
}

/* Renders one or more knowledge-check questions with instant
   feedback. Purely for reinforcement — never blocks progress,
   people can continue whether they get it right or not. Accepts
   an array so a lesson can ask more than one question. */
function renderChecksInto(containerId, checks){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!checks || !checks.length) return;

  checks.forEach((check) => {
    const box = document.createElement('div');
    box.className = 'check-box';
    box.innerHTML = `
      <span class="check-eyebrow">${check.label || 'Quick check'}</span>
      <div class="check-q">${check.question}</div>
      <div class="check-options-wrap"></div>
      <div class="check-feedback"></div>
    `;
    container.appendChild(box);

    const optionsWrap = box.querySelector('.check-options-wrap');
    const feedback = box.querySelector('.check-feedback');
    check.options.forEach((optText, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'check-option';
      btn.textContent = optText;
      btn.onclick = () => {
        const allButtons = optionsWrap.querySelectorAll('.check-option');
        allButtons.forEach(b => b.disabled = true);
        if (i === check.correct){
          btn.classList.add('correct');
        } else {
          btn.classList.add('incorrect');
          allButtons[check.correct].classList.add('correct');
        }
        feedback.classList.add('show');
        feedback.innerHTML = (i === check.correct ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + check.explanation;
      };
      optionsWrap.appendChild(btn);
    });
  });
}

window.goToLesson = function(direction){
  window.location.href = 'lesson.html?course=' + courseId + '&lesson=' + (lessonNum + direction);
};

/* Renders a short reflection prompt. Saved answers persist to
   Firestore and are shown back pre-filled if the person revisits. */
function renderReflection(reflection, lessonId){
  const container = document.getElementById('reflectionContainer');
  container.innerHTML = '';
  if (!reflection) return;

  const existing = reflections[lessonId] || '';
  const box = document.createElement('div');
  box.className = 'reflection-box';
  box.innerHTML = `
    <span class="rlabel">Your reflection</span>
    <p style="margin:0 0 10px; font-size:13.5px;">${reflection.prompt}</p>
    <textarea id="reflectionInput" placeholder="Type your answer here">${existing}</textarea>
    <div class="reflection-save-row">
      <span class="reflection-saved-note" id="reflectionSavedNote">${existing ? 'Saved previously' : ''}</span>
      <button type="button" id="reflectionSaveBtn">Save reflection</button>
    </div>
  `;
  container.appendChild(box);

  box.querySelector('#reflectionSaveBtn').onclick = async () => {
    const text = box.querySelector('#reflectionInput').value.trim();
    reflections[lessonId] = text;
    try {
      const progressRef = doc(db, 'progress', currentUser.uid);
      const snap = await getDoc(progressRef);
      const data = snap.exists() ? snap.data() : { courses: {} };
      data.courses = data.courses || {};
      data.courses[courseId] = data.courses[courseId] || {};
      data.courses[courseId].reflections = reflections;
      await setDoc(progressRef, data);
      box.querySelector('#reflectionSavedNote').textContent = 'Saved just now';
    } catch (err){
      console.error('Saving reflection failed:', err);
      box.querySelector('#reflectionSavedNote').textContent = 'Could not save — try again';
    }
  };
}

/* ================================================================
   COURSE COMPLETION SCREEN
   Shown in place of the lesson after the last lesson is completed,
   instead of bouncing straight to the dashboard. Pulls together a
   recap (course.recap if authored, else lesson titles), the
   learner's saved reflections for this course, a recommended next
   course (same gap logic the dashboard uses), and — once every
   assigned course is done — a nudge to retake the assessment.
   ================================================================ */
const TIER_SLUGS = ['novice', 'moderate', 'experienced', 'advanced'];

function tierSlugForPct(pct){
  if (pct > 75) return 'advanced';
  if (pct > 50) return 'experienced';
  if (pct > 25) return 'moderate';
  return 'novice';
}

function courseIsComplete(coursesMap, cid){
  const c = CATALOG[cid];
  if (!c || !c.lessons.length) return false;
  const done = ((coursesMap[cid] || {}).completed || []).filter(id => c.lessons.some(l => l.id === id));
  return done.length >= c.lessons.length;
}

function recommendNext(coursesMap, result){
  if (!result || !result.categoryPct) return [];
  const gaps = Object.keys(DOMAINS).map(domainKey => {
    const assessedIdx = TIER_SLUGS.indexOf(tierSlugForPct(result.categoryPct[domainKey] || 0));
    let assigned = 0, completed = 0;
    TIER_SLUGS.forEach((slug, i) => {
      if (i < assessedIdx) return;
      assigned++;
      if (courseIsComplete(coursesMap, domainKey + '-' + slug)) completed++;
    });
    return { domainKey, gap: assigned - completed, pct: result.categoryPct[domainKey] || 0 };
  });
  gaps.sort((a, b) => (b.gap - a.gap) || (a.pct - b.pct));

  const out = [];
  gaps.filter(g => g.gap > 0).forEach(({ domainKey }) => {
    if (out.length >= 2) return;
    let i = TIER_SLUGS.indexOf(tierSlugForPct(result.categoryPct[domainKey] || 0));
    let cid = domainKey + '-' + TIER_SLUGS[i];
    while (CATALOG[cid] && courseIsComplete(coursesMap, cid) && i < TIER_SLUGS.length - 1){
      i++; cid = domainKey + '-' + TIER_SLUGS[i];
    }
    if (CATALOG[cid] && cid !== courseId && !courseIsComplete(coursesMap, cid)){
      out.push({ cid, title: CATALOG[cid].title });
    }
  });
  return out;
}

function showCourseComplete(coursesMap){
  ['lessonNav','preCheckContainer','lessonBody','chartContainer','stepperContainer',
   'checkContainer','reflectionContainer','sourceLinkRow'].forEach(id => {
    const el = document.getElementById(id); if (el) el.style.display = 'none';
  });
  const navRow = document.querySelector('.nav-row'); if (navRow) navRow.style.display = 'none';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('courseTitle').textContent = course.title;
  document.getElementById('lessonTitle').textContent = 'Course complete';

  const recapItems = (course.recap && course.recap.length)
    ? course.recap
    : course.lessons.map(l => l.title.replace(/^Lesson\s*\d+:\s*/, ''));
  const recapHtml = `
    <div style="background:#F7F9FC; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-top:8px;">
      <span class="eyebrow">${course.recap ? 'The takeaways' : 'What this course covered'}</span>
      <ul style="margin:8px 0 0; padding-left:20px;">
        ${recapItems.map(t => `<li style="line-height:1.55; color:var(--ink-soft); margin-bottom:6px;">${t}</li>`).join('')}
      </ul>
    </div>`;

  const myNotes = Object.keys(reflections)
    .map(lid => ({ lid: parseInt(lid, 10), text: (reflections[lid] || '').trim() }))
    .filter(n => n.text)
    .map(n => {
      const lesson = course.lessons.find(l => l.id === n.lid);
      const prompt = lesson && lesson.reflection ? lesson.reflection.prompt : '';
      return `
        <div style="border-left:3px solid var(--cyan); padding:2px 0 2px 12px; margin-bottom:12px;">
          ${prompt ? `<div style="font-size:12px; color:var(--gray); margin-bottom:4px;">${prompt}</div>` : ''}
          <div style="font-size:13.5px; color:var(--ink); white-space:pre-wrap;">${n.text.replace(/</g, '&lt;')}</div>
        </div>`;
    }).join('');
  const notesHtml = myNotes ? `
    <div style="margin-top:20px;">
      <span class="eyebrow">Your notes from this course</span>
      <div style="margin-top:10px;">${myNotes}</div>
    </div>` : '';

  const recs = recommendNext(coursesMap, assessmentResult);
  const recsHtml = recs.length ? `
    <div style="margin-top:20px;">
      <span class="eyebrow">Recommended next</span>
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
        ${recs.map(r => `<a href="lesson.html?course=${r.cid}" class="lesson-pill" style="text-align:left;">${r.title} →</a>`).join('')}
      </div>
    </div>` : '';

  const retakeHtml = recs.length ? '' : `
    <div style="margin-top:20px; background:#EEF3FA; border:1px solid var(--line); border-radius:12px; padding:16px 18px;">
      <p style="margin:0 0 10px; font-size:13.5px;">You've cleared every course at your assessed level. Retake the assessment to see how far you've moved and unlock the next set.</p>
      <a href="index.html" class="btn btn-primary" style="text-decoration:none; display:inline-block;">Retake the assessment →</a>
    </div>`;

  document.getElementById('courseCompleteScreen').innerHTML = `
    ${recapHtml}
    ${course.sourceUrl ? `
      <div class="linkedin-box">
        <p>This course has a companion article on our Product+ newsletter. Take a look and share your comments.</p>
        <a class="linkedin-btn" href="${course.sourceUrl}" target="_blank" rel="noopener">Review on Product+ ↗</a>
      </div>` : ''}
    ${notesHtml}
    ${recsHtml}
    ${retakeHtml}
    <div style="margin-top:22px;">
      <a href="lms-dashboard.html?justCompleted=1" class="btn btn-ghost" style="text-decoration:none; display:inline-block;">Back to your dashboard</a>
    </div>
  `;
  document.getElementById('courseCompleteScreen').style.display = 'block';
}

window.markCompleteAndContinue = async function(){
  if (!completedLessons.includes(lessonNum)) completedLessons.push(lessonNum);

  const progressRef = doc(db, 'progress', currentUser.uid);
  const snap = await getDoc(progressRef);
  const data = snap.exists() ? snap.data() : { courses: {} };
  data.courses = data.courses || {};
  const existingCourseData = data.courses[courseId] || {};
  data.courses[courseId] = {
    completed: completedLessons,
    lastLesson: lessonNum,
    updatedAt: new Date().toISOString(),
    reflections: existingCourseData.reflections || reflections
  };
  await setDoc(progressRef, data);

  const isLast = lessonNum === course.lessons[course.lessons.length - 1].id;
  if (isLast){
    showCourseComplete(data.courses || {});
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    window.location.href = 'lesson.html?course=' + courseId + '&lesson=' + (lessonNum + 1);
  }
};
