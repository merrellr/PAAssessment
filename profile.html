<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Product Advisory Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1A4584; --navy-deep: #12305e; --gray: #9AA3AD; --cyan: #35C2E8;
    --bg: #F5F8FB; --surface: #FFFFFF; --ink: #16213E; --ink-soft: #4B5768; --line: #E3E9F0;
    --warn: #C0622A;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); font-family:'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  .field-pair{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 16px; }
  .brand-header{ display:flex; align-items:center; gap:9px; padding: 0 0 14px; }
  .brand-word{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 15px; color: var(--navy-deep); }
  .brand-accent-bar{ height: 3px; background: linear-gradient(90deg, var(--navy) 0%, var(--cyan) 100%); border-radius: 2px; margin-bottom: 24px; }
  .back-link{ font-size: 13px; color: var(--gray); text-decoration:none; display:inline-block; margin-bottom: 16px; }
  .back-link:hover{ color: var(--navy); }

  .card{ background: var(--surface); border-radius: 16px; border: 1px solid var(--line); padding: 28px; box-shadow: 0 1px 2px rgba(22,33,62,0.04), 0 12px 32px rgba(22,33,62,0.06); margin-bottom: 22px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size: 20px; margin: 0 0 4px; color: var(--navy-deep); }
  h2{ font-family:'Space Grotesk', sans-serif; font-size: 15px; margin: 0 0 4px; color: var(--navy-deep); }
  p{ line-height:1.55; color: var(--ink-soft); font-size: 13.5px; }

  .avatar-row{ display:flex; align-items:center; gap:14px; margin-bottom: 22px; }
  .avatar-circle{ width:52px; height:52px; border-radius:50%; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; }
  .avatar-meta .name{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 16px; }
  .avatar-meta .email{ font-size: 12.5px; color: var(--gray); }
  .avatar-meta .verified{ font-size: 11.5px; margin-top:2px; }
  .verified.yes{ color:#2E8B57; }
  .verified.no{ color: var(--warn); }

  .profile-field-label{ display:block; font-size:12px; font-weight:600; color: var(--ink-soft); margin: 0 0 5px 2px; }
  .text-input{ width:100%; padding: 12px 14px; margin-bottom: 14px; border: 1.5px solid var(--line); border-radius: 9px; font-family:'IBM Plex Sans', sans-serif; font-size: 14.5px; }
  .text-input.has-companion{ margin-bottom: 4px; }
  .suggest-chip{ display:inline-flex; align-items:center; gap:6px; font-size: 12.5px; color: var(--navy); background: #EEF3FA; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; margin: 0 0 14px; cursor:pointer; }
  .suggest-chip:hover{ border-color: var(--cyan); }
  .suggest-chip b{ font-weight:600; }
  .text-input:focus{ outline:none; border-color: var(--cyan); }
  .field-error{ font-size: 12.5px; color: var(--warn); margin: -8px 0 12px 2px; min-height: 1px; }

  button.btn{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 14px; border-radius: 8px; padding: 11px 20px; border: none; cursor:pointer; }
  .btn-primary{ background: linear-gradient(90deg, var(--navy) 0%, var(--navy-deep) 100%); color:#fff; }
  .btn-primary:hover{ opacity:0.92; }
  .btn-ghost{ background:none; color: var(--gray); border: 1px solid var(--line); }

  .divider{ height:1px; background:var(--line); margin: 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <a href="lms-dashboard.html" class="brand-header" style="text-decoration:none;">
    <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="#1A4584"/>
      <polygon points="20,10 29,15 29,25 20,30 11,25 11,15" fill="none" stroke="#35C2E8" stroke-width="1.5"/>
    </svg>
    <div>
      <div style="font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:10.5px; letter-spacing:0.06em; color:var(--gray); line-height:1;">PRODUCT ADVISORY</div>
      <div class="brand-word" style="font-size:19px; line-height:1.3;">Learning</div>
    </div>
  </a>
  <div class="brand-accent-bar"></div>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <a class="back-link" href="lms-dashboard.html" style="margin-bottom:0;">← Back to dashboard</a>
    <a href="https://www.productadvisory.co/" target="_blank" rel="noopener" style="font-size:13px; color:var(--navy); text-decoration:underline;">Visit Product Advisory ↗</a>
  </div>

  <div class="card">
    <div class="avatar-row">
      <div class="avatar-circle" id="avatarCircle"></div>
      <div class="avatar-meta">
        <div class="name" id="profileName"></div>
        <div class="email" id="profileEmail"></div>
        <div class="verified" id="profileVerified"></div>
      </div>
    </div>

    <div class="field-pair">
      <div>
        <label class="profile-field-label">Display name</label>
        <input class="text-input" type="text" id="editDisplayName" placeholder="Your name">
      </div>
      <div>
        <label class="profile-field-label">Company</label>
        <input class="text-input has-companion" type="text" id="editCompany" placeholder="Company (start typing)" list="companyList" autocomplete="off" oninput="handleCompanyInput()">
        <datalist id="companyList"></datalist>
        <div class="suggest-chip" id="companySuggest" style="display:none;"></div>
      </div>
    </div>

    <div class="field-pair">
      <div>
        <label class="profile-field-label">Phone number</label>
        <input class="text-input" type="tel" id="editPhone" placeholder="(555) 555-5555">
      </div>
      <div>
        <label class="profile-field-label">Role / job title</label>
        <input class="text-input" type="text" id="editJobTitle" placeholder="Job title (start typing)" list="jobTitleList">
        <datalist id="jobTitleList"></datalist>
      </div>
    </div>

    <div class="field-pair">
      <div>
        <label class="profile-field-label">Company size</label>
        <select class="text-input" id="editCompanySize">
          <option value="">Select one</option>
          <option value="1-10">1-10 employees</option>
          <option value="11-50">11-50 employees</option>
          <option value="51-200">51-200 employees</option>
          <option value="201-1000">201-1,000 employees</option>
          <option value="1000+">1,000+ employees</option>
        </select>
      </div>
      <div>
        <label class="profile-field-label">Industry</label>
        <input class="text-input" type="text" id="editIndustry" placeholder="Industry (start typing)" list="industryList">
        <datalist id="industryList"></datalist>
      </div>
    </div>

    <div class="field-error" id="editProfileError"></div>
    <div class="field-error" id="editProfileSuccess" style="color:#2E8B57;"></div>

    <button class="btn btn-primary" onclick="handleSaveProfile()">Save profile</button>
  </div>

  <div class="card" id="changePasswordSection">
    <h2>Change password</h2>
    <input class="text-input" type="password" id="currentPasswordInput" placeholder="Current password">
    <div class="field-pair">
      <div>
        <input class="text-input" type="password" id="newPasswordInput" placeholder="New password">
      </div>
      <div>
        <input class="text-input" type="password" id="newPasswordConfirmInput" placeholder="Confirm new password">
      </div>
    </div>
    <div class="field-error" id="changePasswordError"></div>
    <div class="field-error" id="changePasswordSuccess" style="color:#2E8B57;"></div>
    <button class="btn btn-primary" onclick="handleChangePassword()">Save new password</button>
  </div>

  <div class="card">
    <h2>Change email</h2>
    <p>We'll send a confirmation link to your new address — the change won't take effect until you click it there.</p>
    <input class="text-input" type="email" id="editNewEmail" placeholder="New email address">
    <input class="text-input" type="password" id="editEmailCurrentPassword" placeholder="Current password" style="display:none;">
    <div class="field-error" id="editEmailError"></div>
    <div class="field-error" id="editEmailSuccess" style="color:#2E8B57;"></div>
    <button class="btn btn-primary" onclick="handleChangeEmail()">Send confirmation link</button>
  </div>

  <div style="margin-top:40px; padding:20px 0; border-top:1px solid var(--line); text-align:center; font-size:12px; color:var(--gray);">
    © <span id="footerYear"></span> Product Advisory, LLC. All rights reserved. &nbsp;·&nbsp;
    <a href="https://www.productadvisory.co/privacy-policy" target="_blank" rel="noopener" style="color:var(--gray); text-decoration:underline;">Privacy Policy</a> &nbsp;·&nbsp;
    <a href="https://www.productadvisory.co/terms-of-use" target="_blank" rel="noopener" style="color:var(--gray); text-decoration:underline;">Terms of Use</a>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAcECtS5c6WeOhKlwRK-LYFE47npbuq_eU",
  authDomain: "product-advisory-lms.firebaseapp.com",
  projectId: "product-advisory-lms",
  storageBucket: "product-advisory-lms.firebasestorage.app",
  messagingSenderId: "1081134406437",
  appId: "1:1081134406437:web:72e28604d093219e7698cc"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, GoogleAuthProvider,
  reauthenticateWithCredential, reauthenticateWithPopup, EmailAuthProvider, updatePassword,
  updateProfile, verifyBeforeUpdateEmail
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* ================================================================
   Same job title / industry lists and company auto-suggest logic
   used on the assessment, kept in sync so both places offer the
   same experience. RESULTS_LOG_URL is the same Apps Script backend.
   ================================================================ */
const RESULTS_LOG_URL = "https://script.google.com/macros/s/AKfycbynJQYF9rv5maL_CGniS9UGhTDfBVeW3gVhEWUsFdGOqquv4osGx4nQvc8jNkaaY6wrrg/exec";

const JOB_TITLE_OPTIONS = [
  "Product Manager", "Senior Product Manager", "Director of Product",
  "VP of Product", "Chief Product Officer", "Head of Product",
  "Product Owner", "Product Marketing Manager", "Program Manager",
  "Project Manager", "Business Analyst", "UX Designer", "UX Researcher",
  "Engineering Manager", "CTO", "CEO / Founder", "Quality Director",
  "VP of Quality", "Clinical Quality Manager", "Healthcare Administrator",
  "Consultant"
];

const INDUSTRY_OPTIONS = [
  "Healthcare Technology / Health IT", "Healthcare Provider (Hospital / Health System)",
  "Healthcare Payer", "Pharmaceuticals / Biotech", "Software / SaaS",
  "Financial Services", "Insurance", "Government / Public Sector",
  "Education", "Nonprofit / Association", "Manufacturing",
  "Retail / E-commerce", "Consulting", "Telecommunications", "Consumer Products"
];

function populateStaticDatalists(){
  const jobList = document.getElementById('jobTitleList');
  JOB_TITLE_OPTIONS.forEach(opt => {
    const el = document.createElement('option');
    el.value = opt;
    jobList.appendChild(el);
  });
  const indList = document.getElementById('industryList');
  INDUSTRY_OPTIONS.forEach(opt => {
    const el = document.createElement('option');
    el.value = opt;
    indList.appendChild(el);
  });
}
populateStaticDatalists();

let knownCompanies = [];

function loadKnownCompanies(){
  if (!RESULTS_LOG_URL) return;
  const callbackName = 'companiesCallback_' + Date.now();
  window[callbackName] = function(list){
    knownCompanies = list || [];
    const dl = document.getElementById('companyList');
    dl.innerHTML = '';
    knownCompanies.forEach(name => {
      const el = document.createElement('option');
      el.value = name;
      dl.appendChild(el);
    });
    delete window[callbackName];
    script.remove();
  };
  const script = document.createElement('script');
  script.src = RESULTS_LOG_URL + '?action=companies&callback=' + callbackName;
  script.onerror = function(){ /* fail silently — company field still works as plain text */ };
  document.body.appendChild(script);
}
loadKnownCompanies();

function editDistance(a, b){
  a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
  const dp = Array(a.length + 1).fill(null).map(() => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++){
    for (let j = 1; j <= b.length; j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}

window.handleCompanyInput = function(){
  const input = document.getElementById('editCompany');
  const chip = document.getElementById('companySuggest');
  const typed = input.value.trim();

  if (typed.length < 3 || knownCompanies.includes(typed)){
    chip.style.display = 'none';
    return;
  }

  let bestMatch = null, bestDist = Infinity;
  knownCompanies.forEach(name => {
    const dist = editDistance(typed, name);
    if (dist < bestDist) { bestDist = dist; bestMatch = name; }
  });

  const threshold = typed.length <= 6 ? 1 : 2;
  if (bestMatch && bestDist > 0 && bestDist <= threshold){
    chip.innerHTML = 'Did you mean <b>' + bestMatch + '</b>?';
    chip.style.display = 'inline-flex';
    chip.onclick = () => {
      input.value = bestMatch;
      chip.style.display = 'none';
    };
  } else {
    chip.style.display = 'none';
  }
};

function friendlyAuthError(code){
  const map = {
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect password.',
    'auth/email-already-in-use': 'That email is already in use by another account.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/requires-recent-login': 'Please log out and back in, then try again.'
  };
  return map[code] || 'Something went wrong — please try again.';
}

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = 'lms-dashboard.html';
    return;
  }
  currentUser = user;

  const initial = ((user.displayName || user.email || '?').charAt(0)).toUpperCase();
  document.getElementById('avatarCircle').textContent = initial;
  document.getElementById('profileName').textContent = user.displayName || 'Add your name';
  document.getElementById('profileEmail').textContent = user.email;
  const verifiedEl = document.getElementById('profileVerified');
  verifiedEl.textContent = user.emailVerified ? 'Email verified' : 'Email not verified';
  verifiedEl.className = 'verified ' + (user.emailVerified ? 'yes' : 'no');

  document.getElementById('editDisplayName').value = user.displayName || '';

  const hasPasswordProvider = user.providerData.some(p => p.providerId === 'password');
  document.getElementById('editEmailCurrentPassword').style.display = hasPasswordProvider ? 'block' : 'none';
  document.getElementById('changePasswordSection').style.display = hasPasswordProvider ? 'block' : 'none';

  const progressRef = doc(db, 'progress', user.uid);
  const snap = await getDoc(progressRef);
  const data = snap.exists() ? snap.data() : {};
  const profile = data.profile || {};
  document.getElementById('editCompany').value = profile.company || '';
  document.getElementById('editPhone').value = profile.phone || '';
  document.getElementById('editJobTitle').value = profile.jobTitle || '';
  document.getElementById('editCompanySize').value = profile.companySize || '';
  document.getElementById('editIndustry').value = profile.industry || '';
});

window.handleSaveProfile = async function(){
  const errorEl = document.getElementById('editProfileError');
  const successEl = document.getElementById('editProfileSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  const newName = document.getElementById('editDisplayName').value.trim();
  const company = document.getElementById('editCompany').value.trim();
  const phone = document.getElementById('editPhone').value.trim();
  const jobTitle = document.getElementById('editJobTitle').value.trim();
  const companySize = document.getElementById('editCompanySize').value;
  const industry = document.getElementById('editIndustry').value.trim();

  try {
    if (newName !== (currentUser.displayName || '')){
      await updateProfile(currentUser, { displayName: newName });
      const initial = ((newName || currentUser.email || '?').charAt(0)).toUpperCase();
      document.getElementById('avatarCircle').textContent = initial;
      document.getElementById('profileName').textContent = newName || 'Add your name';
    }

    const progressRef = doc(db, 'progress', currentUser.uid);
    const snap = await getDoc(progressRef);
    const data = snap.exists() ? snap.data() : { courses: {} };
    data.profile = { company, phone, jobTitle, companySize, industry };
    await setDoc(progressRef, data);

    successEl.textContent = 'Profile saved.';
  } catch (err){
    console.error('Could not save profile:', err);
    errorEl.textContent = 'Something went wrong saving your profile — please try again.';
  }
};

window.handleChangePassword = async function(){
  const currentPassword = document.getElementById('currentPasswordInput').value;
  const newPassword = document.getElementById('newPasswordInput').value;
  const confirmPassword = document.getElementById('newPasswordConfirmInput').value;
  const errorEl = document.getElementById('changePasswordError');
  const successEl = document.getElementById('changePasswordSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  if (!currentPassword || !newPassword || !confirmPassword){
    errorEl.textContent = 'Fill in all three fields.';
    return;
  }
  if (newPassword !== confirmPassword){
    errorEl.textContent = 'New passwords do not match.';
    return;
  }
  if (newPassword.length < 6){
    errorEl.textContent = 'New password should be at least 6 characters.';
    return;
  }

  try {
    const credential = EmailAuthProvider.credential(currentUser.email, currentPassword);
    await reauthenticateWithCredential(currentUser, credential);
    await updatePassword(currentUser, newPassword);
    successEl.textContent = 'Password updated.';
    document.getElementById('currentPasswordInput').value = '';
    document.getElementById('newPasswordInput').value = '';
    document.getElementById('newPasswordConfirmInput').value = '';
  } catch (err){
    errorEl.textContent = friendlyAuthError(err.code);
  }
};

window.handleChangeEmail = async function(){
  const errorEl = document.getElementById('editEmailError');
  const successEl = document.getElementById('editEmailSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  const newEmail = document.getElementById('editNewEmail').value.trim();
  if (!newEmail){
    errorEl.textContent = 'Enter the new email address.';
    return;
  }

  try {
    const hasPasswordProvider = currentUser.providerData.some(p => p.providerId === 'password');
    if (hasPasswordProvider){
      const currentPassword = document.getElementById('editEmailCurrentPassword').value;
      if (!currentPassword){
        errorEl.textContent = 'Enter your current password to confirm this change.';
        return;
      }
      const credential = EmailAuthProvider.credential(currentUser.email, currentPassword);
      await reauthenticateWithCredential(currentUser, credential);
    } else {
      await reauthenticateWithPopup(currentUser, new GoogleAuthProvider());
    }

    await verifyBeforeUpdateEmail(currentUser, newEmail);
    successEl.textContent = 'Confirmation link sent to ' + newEmail + ' — click it there to finish the change.';
    document.getElementById('editNewEmail').value = '';
    document.getElementById('editEmailCurrentPassword').value = '';
  } catch (err){
    errorEl.textContent = friendlyAuthError(err.code);
  }
};
</script>
<script>document.getElementById("footerYear").textContent = new Date().getFullYear();</script>
</body>
</html>
